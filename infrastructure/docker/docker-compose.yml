# Local development stack. Node apps run on the host (pnpm dev).
name: freelancer-accounting

services:
  postgres:
    image: postgres:16-alpine
    container_name: fa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fa_owner
      POSTGRES_PASSWORD: fa_owner
      POSTGRES_DB: freelancer_accounting
    ports: ['5432:5432']
    volumes: ['fa-postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fa_owner -d freelancer_accounting']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fa-redis
    restart: unless-stopped
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['fa-redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: fa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fa_minio
      MINIO_ROOT_PASSWORD: fa_minio_secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['fa-minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the `documents` bucket once minio is up, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: fa-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fa_minio fa_minio_secret &&
      mc mb --ignore-existing local/documents &&
      echo 'bucket documents ready'"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fa-pgadmin
    restart: unless-stopped
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ['8888:80']
    volumes: ['fa-pgadmin-data:/var/lib/pgadmin']

volumes:
  fa-postgres-data:
  fa-redis-data:
  fa-minio-data:
  fa-pgadmin-data:
