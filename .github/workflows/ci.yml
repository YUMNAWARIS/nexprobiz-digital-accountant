# §46 CI Pipeline. PR cannot merge when this fails.
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: fa_owner,
            POSTGRES_PASSWORD: fa_owner,
            POSTGRES_DB: freelancer_accounting,
          }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fa_owner" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://fa_owner:fa_owner@localhost:5432/freelancer_accounting
      DATABASE_URL: postgres://fa_runtime:fa_runtime@localhost:5432/freelancer_accounting
      TEST_DATABASE_ADMIN_URL: postgres://fa_owner:fa_owner@localhost:5432/postgres
      DB_RUNTIME_PASSWORD: fa_runtime
      JWT_SECRET: ci-access-secret-ci-access-secret-0000000
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-0000
      STORAGE_DRIVER: local
      QUEUE_DRIVER: inmemory
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture rules (ARCH-002/003/007)
        run: pnpm arch

      - name: Database schema validation (migrate up, seed, roll back, migrate up)
        run: |
          pnpm --filter @fa/database migrate
          pnpm --filter @fa/database seed
          pnpm --filter @fa/database rollback:all
          pnpm --filter @fa/database migrate
          pnpm --filter @fa/database seed

      - name: Backend unit tests
        run: pnpm --filter @fa/api test:unit
      - name: Backend integration tests
        run: pnpm --filter @fa/api test:integration
      - name: Contracts tests
        run: pnpm --filter @fa/contracts test

      - name: Web tests
        run: pnpm --filter @fa/web test --if-present
      - name: Mobile tests
        run: pnpm --filter @fa/mobile test --if-present

      - name: Build api
        run: pnpm --filter @fa/api build
      - name: Build worker
        run: pnpm --filter @fa/worker build --if-present
      - name: Build web
        run: pnpm --filter @fa/web build --if-present
        env: { NEXT_PUBLIC_API_URL: http://localhost:8000, NEXT_PUBLIC_ENVIRONMENT: sandbox }

      - name: Playwright smoke (where environment available)
        if: ${{ false }} # enabled in P4 once apps/web + e2e exist
        run: pnpm test:e2e
